<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Squad Wine 🍷</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Floating Background Particles -->
    <div class="particles-container">
        <span class="particle p1">🍷</span>
        <span class="particle p2">🍇</span>
        <span class="particle p3">✨</span>
        <span class="particle p4">🍇</span>
        <span class="particle p5">🍷</span>
    </div>

    <main class="wrapper">
        <div class="top-bar">
            <button id="theme-toggle" class="icon-toggle" onclick="toggleTheme()">🌙 CELLAR MODE</button>
            <button id="audio-toggle" class="icon-toggle" onclick="toggleAmbience()">🔇 JAZZ ON</button>
        </div>

        <img src="img.jpg" alt="Squad Wine" class="squad-logo">

        <section class="cellar-section">
            <h2 class="cellar-title">SQUAD WINE - THE CELLAR</h2>
            
            <div class="cellar-controls">
                <div class="counter-badge">POURED: <span id="pour-count">0</span> 🍷</div>
                <div class="filter-group">
                    <button class="filter-btn active" onclick="filterWine('all', this)">ALL</button>
                    <button class="filter-btn" onclick="filterWine('red', this)">REDS</button>
                    <button class="filter-btn" onclick="filterWine('white', this)">WHITES</button>
                    <button class="filter-btn" onclick="filterWine('mystery', this)">?</button>
                </div>
            </div>

            <div class="rack-grid">
                <!-- Henschke -->
                <div class="wine-bottle henenschke-wine red" onclick="openNotes('2023 Henschke Keyneton Euphonium', 'THIS GUY IS ALWAYS IN KYNETON! Barossa blend (Shiraz/Cabernet). Fresh plum, mulberry, anise, and crushed herbs with fine-grained tannins.\n\nBest Drinking Window: now–2048+\n\n $$', 'henschke.jpg', 'Beef, Lamb, Venison, and Hard Cheeses')">
                    <div class="bottle-neck"></div>
                    <div class="bottle-body">
                        <span class="mini-label">HENSCHKE</span>
                    </div>
                </div>
                <!-- d'Arenberg -->
                <div class="wine-bottle darenberg-wine red" onclick="openNotes('2019 d\'Arenberg The Dead Arm Shiraz', 'HAVE YOU JUST BEEN PUNCHED?! Bold & concentrated McLaren Vale Shiraz. Dark cherry, mocha, licorice, and tapenade with structured tannins.\n\nBest Drinking Window: now–2039 \n\n$$', 'deadarm.jpg', 'Prime Rib, Barbecue Pork, Lamb, and Charcuterie')">
                    <div class="bottle-neck"></div>
                    <div class="bottle-body">
                        <span class="mini-label">DEAD ARM</span>
                    </div>
                </div>
                <!-- Produttori -->
                <div class="wine-bottle produttori-wine red" onclick="openNotes('2022 Produttori del Barbaresco', 'IT\'S BARBARESCO BABY! Pure Italian Nebbiolo. Ripe raspberry liqueur, dark cherry, orange peel, and violet notes with taut, refined tannins.\n\nBest Drinking Window: now–2040\n\n$$$', 'barb.jpg', 'Duck, Truffles, Roast Pork, Pasta Ragù, and Veal')">
                    <div class="bottle-neck"></div>
                    <div class="bottle-body">
                        <span class="mini-label">BARBARESCO</span>
                    </div>
                </div>
                <!-- Buisson-Battault -->
                <div class="wine-bottle buisson-wine white" onclick="openNotes('2023 Domaine Buisson-Battault Meursault Vieilles Vignes', 'OUI! OUI! Classic White Burgundy. Vibrant golden apple, roasted hazelnut, white flowers, and citrus oil backed by flinty minerality and rich texture.\n\nBest Drinking Window: 2027–2038 or if you are a Sharp smash or tip down the sink at your convenience\n\n$$$$ ', 'meursault.jpg', 'Lobster, Scallops, Shellfish, Poultry, and Cream Sauces')">
                    <div class="bottle-neck"></div>
                    <div class="bottle-body">
                        <span class="mini-label">MEURSAULT</span>
                    </div>
                </div>
                <!-- Yering Station -->
                <div class="wine-bottle yering-wine white" onclick="openNotes('2017 Yering Station Chardonnay', 'YARRA VALLEY CLASSIC! Elegant and creamy with white peach, grapefruit zest, subtle cashew oak, and a long, crisp mineral finish.\n\nBest Drinking Window: now–2028\n\n$$', 'yering.png', 'Roast Chicken, Salmon, White Fish, Pork Tenderloin, and Soft Cheeses')">
                    <div class="bottle-neck"></div>
                    <div class="bottle-body">
                        <span class="mini-label">YERING</span>
                    </div>
                </div>
                <!-- Rickroll Mystery -->
                <div class="wine-bottle mystery-wine mystery" onclick="openNotes('YOU GOT RICK ROLLED! 🍷🕺', 'Never gonna give you up,\nNever gonna let you down,\nNever gonna run around and desert you!\n\nBest Drinking Window: ALL TIME', 'rick-astley-never-gonna-give-you-up.gif', 'Fish & Chips, Salty Snacks, and Good Vibes')">
                    <div class="bottle-neck"></div>
                    <div class="bottle-body">
                        <span class="mini-label mystery-mark">?</span>
                    </div>
                </div>
            </div>

            <button class="dice-btn" onclick="rollSommelier()">🎲 SOMMELIER DICE</button>
        </section>
    </main>

    <div id="tasting-modal" class="modal-overlay" onclick="closeNotes(event)">
        <div class="modal-card">
            <button class="close-btn" onclick="closeNotes(true)">&times;</button>
            <img id="modal-img" src="" alt="Wine Label" class="modal-label-img">
            <h3 id="modal-title"></h3>
            <p id="modal-notes"></p>
            
            <div class="pairing-container">
                <div class="pairing-box">
                    <strong>🍽️ PAIRING:</strong>
                    <span id="food-pairing"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let pourCount = 0;
        let isAmbienceOn = false;
        let audioCtx = null;
        let jazzInterval = null;
        let noiseNode = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playPopSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        function playClinkSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(1800, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.25);
        }

        // Web Audio Jazz Chord Generator
        function playJazzChord() {
            if (!isAmbienceOn) return;
            const chords = [
                [261.63, 329.63, 392.00, 493.88], // Cmaj7
                [220.00, 261.63, 329.63, 392.00], // Am7
                [146.83, 174.61, 220.00, 261.63], // Dm7
                [196.00, 246.94, 293.66, 349.23]  // G7
            ];
            const chord = chords[Math.floor(Math.random() * chords.length)];
            
            chord.forEach(freq => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                
                gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.03, audioCtx.currentTime + 0.5);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.8);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 2.8);
            });
        }

        function toggleAmbience() {
            initAudio();
            const btn = document.getElementById('audio-toggle');
            
            if (!isAmbienceOn) {
                // Vinyl Crackle Noise
                const bufferSize = audioCtx.sampleRate * 2;
                const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = (Math.random() * 2 - 1) * 0.01;
                }

                noiseNode = audioCtx.createBufferSource();
                noiseNode.buffer = noiseBuffer;
                noiseNode.loop = true;
                
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(250, audioCtx.currentTime);

                noiseNode.connect(filter);
                filter.connect(audioCtx.destination);
                noiseNode.start();

                // Start Jazz Progression
                isAmbienceOn = true;
                playJazzChord();
                jazzInterval = setInterval(playJazzChord, 3000);
                
                btn.innerText = "🎷 JAZZ ON";
                btn.classList.add("active");
            } else {
                isAmbienceOn = false;
                if (noiseNode) noiseNode.stop();
                if (jazzInterval) clearInterval(jazzInterval);
                btn.innerText = "🔇 JAZZ OFF";
                btn.classList.remove("active");
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const btn = document.getElementById('theme-toggle');
            if (document.body.classList.contains('dark-mode')) {
                btn.innerText = "☀️ LIGHT MODE";
            } else {
                btn.innerText = "🌙 CELLAR MODE";
            }
        }

        function openNotes(title, notes, imgSrc, pairing) {
            playPopSound();
            pourCount++;
            document.getElementById('pour-count').innerText = pourCount;
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-notes').innerText = notes;
            document.getElementById('modal-img').src = imgSrc;
            document.getElementById('food-pairing').innerText = pairing;
            document.getElementById('tasting-modal').style.display = 'flex';
        }

        function closeNotes(event) {
            if (event === true || event.target.id === 'tasting-modal') {
                playClinkSound();
                document.getElementById('tasting-modal').style.display = 'none';
            }
        }

        function filterWine(type, btnEl) {
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(b => b.classList.remove('active'));
            if (btnEl) btnEl.classList.add('active');

            const bottles = document.querySelectorAll('.wine-bottle');
            bottles.forEach(b => {
                if (type === 'all' || b.classList.contains(type)) {
                    b.style.opacity = '1';
                    b.style.pointerEvents = 'auto';
                    b.style.transform = 'scale(1)';
                } else {
                    b.style.opacity = '0.25';
                    b.style.pointerEvents = 'none';
                    b.style.transform = 'scale(0.9)';
                }
            });
        }

        function rollSommelier() {
            const visibleBottles = Array.from(document.querySelectorAll('.wine-bottle')).filter(b => b.style.opacity !== '0.25');
            const randomBottle = visibleBottles[Math.floor(Math.random() * visibleBottles.length)];
            randomBottle.click();
        }
    </script>

</body>
</html>
