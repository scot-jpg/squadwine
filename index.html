<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Squad Wine 🍷</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Floating Background Particles -->
    <div class="particles-container">
        <span class="particle p1">🍷</span>
        <span class="particle p2">🍇</span>
        <span class="particle p3">✨</span>
        <span class="particle p4">🍇</span>
        <span class="particle p5">🍷</span>
    </div>

    <main class="wrapper">
        <div class="top-bar">
            <button id="theme-toggle" class="icon-toggle" onclick="toggleTheme()">🌙 CELLAR MODE</button>
            <button id="audio-toggle" class="icon-toggle" onclick="toggleAmbience()">🎷 JAZZ ON</button>
        </div>

        <section class="cellar-section">
            <h2 class="cellar-title">SQUAD WINE - THE CELLAR</h2>
            
            <div class="cellar-controls">
                <div class="counter-badge">POURED: <span id="pour-count">0</span> 🍷</div>
                <div class="filter-group">
                    <button class="filter-btn active" onclick="filterWine('all', this)">ALL</button>
                    <button class="filter-btn" onclick="filterWine('red', this)">REDS</button>
                    <button class="filter-btn" onclick="filterWine('white', this)">WHITES</button>
                    <button class="filter-btn" onclick="filterWine('mystery', this)">?</button>
                </div>
            </div>

            <!-- Interactive Cellar Image Map with Lift-Out Effect -->
            <div class="interactive-cellar">
                <img src="cellar-rack.jpg" alt="Wine Cellar Rack" class="cellar-bg-img">

                <svg class="cellar-hotspots" viewBox="0 0 1000 600">
                    <!-- Bottle 1: Henschke (Red) -->
                    <g class="bottle-group red" onclick="openNotes('2023 Henschke Keyneton Euphonium', 'THIS GUY IS ALWAYS IN KYNETON! Barossa blend (Shiraz/Cabernet). Fresh plum, mulberry, anise, and crushed herbs with fine-grained tannins.\n\nBest Drinking Window: now–2048+\n\n $$', 'henschke.jpg', 'Beef, Lamb, Venison, and Hard Cheeses')">
                        <rect class="hotspot-frame" x="50" y="100" width="110" height="400" rx="16" />
                        <rect class="bottle-target" x="55" y="105" width="100" height="390" rx="14" />
                    </g>

                    <!-- Bottle 2: Dead Arm (Red) -->
                    <g class="bottle-group red" onclick="openNotes('2019 d\'Arenberg The Dead Arm Shiraz', 'HAVE YOU JUST BEEN PUNCHED?! Bold & concentrated McLaren Vale Shiraz. Dark cherry, mocha, licorice, and tapenade with structured tannins.\n\nBest Drinking Window: now–2039 \n\n$$', 'deadarm.jpg', 'Prime Rib, Barbecue Pork, Lamb, and Charcuterie')">
                        <rect class="hotspot-frame" x="200" y="100" width="110" height="400" rx="16" />
                        <rect class="bottle-target" x="205" y="105" width="100" height="390" rx="14" />
                    </g>

                    <!-- Bottle 3: Barbaresco (Red) -->
                    <g class="bottle-group red" onclick="openNotes('2022 Produttori del Barbaresco', 'IT\'S BARBARESCO BABY! Pure Italian Nebbiolo. Ripe raspberry liqueur, dark cherry, orange peel, and violet notes with taut, refined tannins.\n\nBest Drinking Window: now–2040\n\n$$$', 'barb.jpg', 'Duck, Truffles, Roast Pork, Pasta Ragù, and Veal')">
                        <rect class="hotspot-frame" x="350" y="100" width="110" height="400" rx="16" />
                        <rect class="bottle-target" x="355" y="105" width="100" height="390" rx="14" />
                    </g>

                    <!-- Bottle 4: Meursault (White) -->
                    <g class="bottle-group white" onclick="openNotes('2023 Domaine Buisson-Battault Meursault Vieilles Vignes', 'OUI! OUI! Classic White Burgundy. Vibrant golden apple, roasted hazelnut, white flowers, and citrus oil backed by flinty minerality and rich texture.\n\nBest Drinking Window: 2027–2038 or if you are a Sharp smash or tip down the sink at your convenience\n\n$$$$ ', 'meursault.jpg', 'Lobster, Scallops, Shellfish, Poultry, and Cream Sauces')">
                        <rect class="hotspot-frame" x="500" y="100" width="110" height="400" rx="16" />
                        <rect class="bottle-target" x="505" y="105" width="100" height="390" rx="14" />
                    </g>

                    <!-- Bottle 5: Yering (White) -->
                    <g class="bottle-group white" onclick="openNotes('2017 Yering Station Chardonnay', 'YARRA VALLEY CLASSIC! Elegant and creamy with white peach, grapefruit zest, subtle cashew oak, and a long, crisp mineral finish.\n\nBest Drinking Window: now–2028\n\n$$', 'yering.png', 'Roast Chicken, Salmon, White Fish, Pork Tenderloin, and Soft Cheeses')">
                        <rect class="hotspot-frame" x="650" y="100" width="110" height="400" rx="16" />
                        <rect class="bottle-target" x="655" y="105" width="100" height="390" rx="14" />
                    </g>

                    <!-- Bottle 6: Mystery Bottle -->
                    <g class="bottle-group mystery" onclick="openNotes('YOU GOT RICK ROLLED! 🍷🕺', 'Never gonna give you up,\nNever gonna let you down,\nNever gonna run around and desert you!\n\nBest Drinking Window: ALL TIME', 'rick-astley-never-gonna-give-you-up.gif', null)">
                        <rect class="hotspot-frame" x="800" y="100" width="110" height="400" rx="16" />
                        <rect class="bottle-target" x="805" y="105" width="100" height="390" rx="14" />
                    </g>
                </svg>
            </div>

            <button class="dice-btn" onclick="rollSommelier()">🎲 SOMMELIER DICE</button>
        </section>
    </main>

    <div id="tasting-modal" class="modal-overlay" onclick="closeNotes(event)">
        <div class="modal-card">
            <button class="close-btn" onclick="closeNotes(true)">&times;</button>
            <img id="modal-img" src="" alt="Wine Label" class="modal-label-img">
            <h3 id="modal-title"></h3>
            <p id="modal-notes"></p>
            
            <div id="pairing-container" class="pairing-container">
                <div class="pairing-box">
                    <strong>🍽️ PAIRING:</strong>
                    <span id="food-pairing"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let pourCount = 0;
        let isAmbienceOn = false;
        let audioCtx = null;
        let jazzInterval = null;
        let noiseNode = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playPopSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        function playJazzChord() {
            if (!isAmbienceOn) return;
            const chords = [
                [261.63, 329.63, 392.00, 493.88], // Cmaj7
                [220.00, 261.63, 329.63, 392.00], // Am7
                [146.83, 174.61, 220.00, 261.63], // Dm7
                [196.00, 246.94, 293.66, 349.23]  // G7
            ];
            const chord = chords[Math.floor(Math.random() * chords.length)];
            
            chord.forEach(freq => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                
                gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.03, audioCtx.currentTime + 0.5);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.8);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 2.8);
            });
        }

        function toggleAmbience() {
            initAudio();
            const btn = document.getElementById('audio-toggle');
            
            if (!isAmbienceOn) {
                const bufferSize = audioCtx.sampleRate * 2;
                const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = (Math.random() * 2 - 1) * 0.01;
                }

                noiseNode = audioCtx.createBufferSource();
                noiseNode.buffer = noiseBuffer;
                noiseNode.loop = true;
                
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(250, audioCtx.currentTime);

                noiseNode.connect(filter);
                filter.connect(audioCtx.destination);
                noiseNode.start();

                isAmbienceOn = true;
                playJazzChord();
                jazzInterval = setInterval(playJazzChord, 3000);
                
                btn.innerText = "🔇 JAZZ OFF";
                btn.classList.add("active");
            } else {
                isAmbienceOn = false;
                if (noiseNode) noiseNode.stop();
                if (jazzInterval) clearInterval(jazzInterval);
                btn.innerText = "🎷 JAZZ ON";
                btn.classList.remove("active");
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const btn = document.getElementById('theme-toggle');
            if (document.body.classList.contains('dark-mode')) {
                btn.innerText = "☀️ LIGHT MODE";
            } else {
                btn.innerText = "🌙 CELLAR MODE";
            }
        }

        function openNotes(title, notes, imgSrc, pairing) {
            playPopSound();
            pourCount++;
            document.getElementById('pour-count').innerText = pourCount;
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-notes').innerText = notes;
            document.getElementById('modal-img').src = imgSrc;
            
            const pairingBox = document.getElementById('pairing-container');
            if (pairing) {
                document.getElementById('food-pairing').innerText = pairing;
                pairingBox.style.display = 'flex';
            } else {
                pairingBox.style.display = 'none';
            }
            
            document.getElementById('tasting-modal').style.display = 'flex';
        }

        function closeNotes(event) {
            if (event === true || event.target.id === 'tasting-modal') {
                document.getElementById('tasting-modal').style.display = 'none';
            }
        }

        function filterWine(type, btnEl) {
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(b => b.classList.remove('active'));
            if (btnEl) btnEl.classList.add('active');

            const groups = document.querySelectorAll('.bottle-group');
            groups.forEach(g => {
                if (type === 'all' || g.classList.contains(type)) {
                    g.style.opacity = '1';
                    g.style.pointerEvents = 'auto';
                } else {
                    g.style.opacity = '0.15';
                    g.style.pointerEvents = 'none';
                }
            });
        }

        function rollSommelier() {
            const visibleGroups = Array.from(document.querySelectorAll('.bottle-group')).filter(g => g.style.opacity !== '0.15');
            const randomGroup = visibleGroups[Math.floor(Math.random() * visibleGroups.length)];
            randomGroup.dispatchEvent(new Event('click'));
        }
    </script>

</body>
</html>
