<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squad Wine 🍷✨</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="window">
        <!-- Header Banner -->
        <div class="hero-header">
            <h1 class="sparkle-title">Squad Wine 🍷✨</h1>
            <div class="hero-banner">
                BUY CUTSIE, DRINK GOOD 🥂 WAKE UP SLEEPY HEADS 😴
            </div>
        </div>

        <!-- Metrics Grid -->
        <div class="grid-2">
            <div class="metric-box">
                <div class="metric-title">Unit Price</div>
                <div class="metric-value">$6.90</div>
            </div>
            <div class="metric-box">
                <div class="metric-title">Total AUM</div>
                <div class="metric-value">420 Bottles</div>
            </div>
            <div class="metric-box span-2 pink-bg">
                <div class="metric-title">Net Tendies</div>
                <div class="metric-value">100% VIBES 📈</div>
            </div>
        </div>

        <!-- Navigation Buttons -->
        <div class="nav-stack">
            <button class="nav-btn active">💖 OUR DROPS</button>
            <button class="nav-btn">🍭 YUMMY TASTINGS</button>
            <button class="nav-btn">📈 SQUIGGLY LINE</button>
            <button class="nav-btn">💬 BOYS CHAT</button>
        </div>

        <!-- Content Card -->
        <div class="content-card">
            <h2>OUR DROPS 🍇</h2>
            <p>Natural wines made for late nights. Zero snobbery, maximum pour.</p>
        </div>

        <!-- Footer -->
        <div class="footer-bar">
            IN SQUAD WE TRUST 🍷
        </div>
    </div>

</body>
</html>
