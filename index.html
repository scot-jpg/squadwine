<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squad Wine 🍷✨</title>
    <!-- Imports Google Fonts: Press Start 2P (Retro Arcade) and Outfit (Clean Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="wrapper">
        <header class="card title-card">
            <h1 class="pixel-text">SQUAD WINE 💖✨</h1>
            <p class="subtitle">BUY CHEAP, DRINK GOOD 🍷</p>
        </header>

        <section class="banner">
            <p>POURING SOON 🍇.... POUTERS GONNA POUT</p>
        </section>

        <section class="stats-grid">
            <div class="card stat-box">
                <span class="stat-label">BOTTLES DROPPED</span>
                <span class="stat-value">0</span>
            </div>
            <div class="card stat-box">
                <span class="stat-label">CURRENT MOOD</span>
                <span class="stat-value">THIRSTY 🤤</span>
            </div>
        </section>

        <section class="card content-card">
            <h2>🎀 OUR DROPS</h2>
            <p>Exclusive small-batch natural wines for the crew. No snooty sommelier vibes allowed.</p>
        </section>

        <footer class="card footer-card">
            <p>IN SQUAD WE TRUST 🥂</p>
        </footer>
    </main>

</body>
</html>
